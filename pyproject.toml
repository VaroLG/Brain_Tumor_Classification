[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc"
version = "0.2.0"
description = "Clasificación de tumores cerebrales en RM con transfer learning (TFM, UOC) — versión reproducible"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Álvaro Linacero Gracia" }]
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.16",      # incluye Keras 3
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Lectores de formatos médicos: solo hacen falta para construir el dataset
medical = ["nibabel>=5.0", "pydicom>=2.4"]
dev = ["pytest>=8.0", "ruff>=0.5", "nibabel>=5.0", "pydicom>=2.4"]

[project.scripts]
btc = "btc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Avisos de deprecación de dependencias (TF/Keras/gast), no de este código
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:keras.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
