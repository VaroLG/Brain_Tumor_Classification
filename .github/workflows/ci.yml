# Integración continua: en cada push y PR se comprueba estilo y tests.
# Los tests usan datos sintéticos y pesos aleatorios, así que corren en CPU
# en un par de minutos sin descargar ningún dataset médico.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Tests (pytest)
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: pytest
